[project]
name = "mean-pic"
version = "0.1.0"
description = "Interpolate images in a diffusion model's latent space"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.10",
    "diffusers>=0.35",
    "pillow>=11.0",
    "safetensors>=0.5",
    "transformers>=5.11",
]

[project.optional-dependencies]
cpu = ["torch==2.9.1", "torchvision==0.24.1"]
cuda = ["torch==2.9.1", "torchvision==0.24.1"]
server = ["fastapi>=0.116", "uvicorn[standard]>=0.35"]

[project.scripts]
mean-pic = "mean_pic.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "corpnet"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
